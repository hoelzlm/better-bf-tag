name: bftag

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    image: ghcr.io/hoelzlm/better-bf-tag-web:${BFTAG_TAG:-latest}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      BFTAG_DOMAIN: ${BFTAG_DOMAIN:?BFTAG_DOMAIN muss gesetzt sein (Domain oder "localhost")}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL muss gesetzt sein (für Let's Encrypt)}

  backend:
    image: ghcr.io/hoelzlm/better-bf-tag-backend:${BFTAG_TAG:-latest}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://bftag:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}@db:5432/bftag
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt sein (mindestens 32 Zeichen)}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      OWN_FIRE_DEPARTMENT_NAME: ${OWN_FIRE_DEPARTMENT_NAME:-Eigene Feuerwehr}

  db:
    image: postgres:17
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: *default-logging
    environment:
      POSTGRES_DB: bftag
      POSTGRES_USER: bftag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bftag -d bftag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  caddy_data: {}
  caddy_config: {}
  db_data: {}
