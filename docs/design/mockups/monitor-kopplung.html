<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>BF-Tag – Monitor Kopplung</title>
<style>
  @font-face { font-family:'Inter'; src: url('fonts/Inter-Regular.ttf'); font-weight:400; }
  @font-face { font-family:'Inter'; src: url('fonts/Inter-Medium.ttf'); font-weight:500; }
  @font-face { font-family:'Inter'; src: url('fonts/Inter-SemiBold.ttf'); font-weight:600; }
  @font-face { font-family:'Inter'; src: url('fonts/Inter-Bold.ttf'); font-weight:700; }
  @font-face { font-family:'Material Icons Outlined'; src: url('fonts/MaterialIconsOutlined-Regular.otf'); }
  :root{
    --surface:#14181C; --surface-variant:#1C2126; --outline:#3A4147;
    --on-surface:#EDEFF1; --on-surface-variant:#AAB2B8;
    --primary:#4FB8C9; --on-primary:#06262B;
    --warning:#F2A93B; --on-warning:#1A1100;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:1920px;height:1080px;background:var(--surface);color:var(--on-surface);font-family:'Inter',sans-serif;overflow:hidden;}
  .msym{font-family:'Material Icons Outlined';font-size:40px;line-height:1;display:inline-block;}
  .wrap{display:flex;align-items:center;justify-content:center;height:1080px;}
  .card{width:900px;text-align:center;padding:64px;}
  .mark{width:96px;height:96px;border-radius:24px;border:3px solid var(--primary);margin:0 auto 32px auto;
    display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;color:var(--primary);}
  h1{font-size:40px;font-weight:600;margin:0 0 16px 0;}
  .sub{font-size:28px;color:var(--on-surface-variant);margin:0 0 40px 0;}
  .hint{display:flex;align-items:center;justify-content:center;gap:12px;font-size:24px;color:var(--on-surface-variant);
    margin-bottom:32px;}
  .hint .msym{font-size:24px;}
  .field-label{font-size:22px;color:var(--on-surface-variant);text-align:left;margin-bottom:8px;font-weight:500;}
  .field{border:2px solid var(--outline);border-radius:16px;padding:32px;font-size:64px;letter-spacing:8px;
    font-weight:600;text-align:center;}
  .field.focus{border-color:var(--primary);border-width:3px;}
  .error{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--warning);font-size:28px;
    margin-top:20px;}
  .error .msym{font-size:28px;}
  .btn{margin-top:40px;background:var(--primary);color:var(--on-primary);font-size:28px;font-weight:600;
    border-radius:12px;padding:18px 0;width:100%;}
  .footer{margin-top:64px;font-size:22px;color:var(--on-surface-variant);}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="mark">F</div>
    <h1>Monitor koppeln</h1>
    <div class="sub">Kopplungscode aus „Monitore“ in der Admin-Web eingeben</div>
    <div class="hint"><span class="msym">info</span>Dieser Monitor wurde gesperrt oder neu gekoppelt.</div>
    <div class="field-label">Kopplungscode</div>
    <div class="field focus">ABCD&nbsp;&nbsp;–&nbsp;&nbsp;EFGH</div>
    <div class="error"><span class="msym">error</span>Ungültiger Code.</div>
    <div class="btn">Koppeln</div>
    <div class="footer">Gerätename wird nach der Kopplung hier angezeigt.</div>
  </div>
</div>
</body>
</html>
