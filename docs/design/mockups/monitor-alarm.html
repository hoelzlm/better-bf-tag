<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>BF-Tag – Monitor Alarm</title>
<style>
  @font-face { font-family:'Inter'; src: url('fonts/Inter-Regular.ttf'); font-weight:400; }
  @font-face { font-family:'Inter'; src: url('fonts/Inter-SemiBold.ttf'); font-weight:600; }
  @font-face { font-family:'Inter'; src: url('fonts/Inter-Bold.ttf'); font-weight:700; }
  :root{
    --alarm:#FF5449; --on-alarm:#1A0000; --alarm-dark:#B2362E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:1920px;height:1080px;background:var(--alarm);color:var(--on-alarm);font-family:'Inter',sans-serif;overflow:hidden;}
  .wrap{display:flex;flex-direction:column;height:1080px;padding:64px 96px;}
  .top{display:flex;justify-content:space-between;align-items:flex-start;}
  .badge{background:var(--on-alarm);color:var(--alarm);font-size:32px;font-weight:700;letter-spacing:2px;padding:10px 24px;border-radius:999px;}
  .clock{font-size:40px;font-weight:600;}
  .keyword{font-size:96px;font-weight:700;line-height:1.05;margin:32px 0 16px 0;}
  .address{font-size:48px;font-weight:600;margin-bottom:8px;}
  .report{font-size:32px;font-weight:400;max-width:1400px;}
  .vehicles{display:flex;gap:32px;margin-top:64px;}
  .vehicle-chip{background:var(--on-alarm);color:var(--alarm);border-radius:16px;padding:20px 32px;font-size:40px;font-weight:700;display:flex;align-items:center;gap:16px;}
  .vehicle-chip .sub{font-size:22px;font-weight:500;opacity:.85;}
  .spacer{flex:1;}
  .bottom{font-size:28px;font-weight:500;opacity:.9;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="badge">ERSTALARM</div>
    <div class="clock">08:34:40</div>
  </div>
  <div class="keyword">B3 Großbrand Lagerhalle</div>
  <div class="address">Industriestraße 7</div>
  <div class="report">Starke Rauchentwicklung aus dem Dach.</div>
  <div class="vehicles">
    <div class="vehicle-chip">HLF-1<span class="sub">alarmiert</span></div>
    <div class="vehicle-chip">RTW-1<span class="sub">alarmiert</span></div>
  </div>
  <div class="spacer"></div>
  <div class="bottom">seit 00:01 · Quittiert: 0/3</div>
</div>
</body>
</html>
