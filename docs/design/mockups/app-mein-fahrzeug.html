<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>App – Mein Fahrzeug</title>
<style>
  @font-face { font-family:'Inter'; src: url('fonts/Inter-Regular.ttf'); font-weight:400; }
  @font-face { font-family:'Inter'; src: url('fonts/Inter-Medium.ttf'); font-weight:500; }
  @font-face { font-family:'Inter'; src: url('fonts/Inter-SemiBold.ttf'); font-weight:600; }
  @font-face { font-family:'Inter'; src: url('fonts/Inter-Bold.ttf'); font-weight:700; }
  :root{
    --surface:#FFFFFF; --surface-variant:#F1F3F5; --surface-container:#E8EAED;
    --outline:#C9CED3; --on-surface:#1B1F23; --on-surface-variant:#4C555C;
    --primary:#0B5E6B; --on-primary:#FFFFFF;
    --fms1:#2E7D32; --fms2:#43A047; --fms3:#F2A900; --fms4:#8E5CD9; --fms5:#F2A900; --fms6:#6B7280;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:390px;height:844px;background:var(--surface);color:var(--on-surface);font-family:'Inter',sans-serif;overflow:hidden;}
  .wrap{display:flex;flex-direction:column;height:844px;}
  .appbar{padding:52px 20px 16px 20px;font-size:22px;font-weight:600;border-bottom:1px solid var(--outline);}
  .content{padding:20px;flex:1;}
  .vehicle-head{margin-bottom:16px;}
  .vehicle-head .name{font-size:22px;font-weight:700;}
  .vehicle-head .kind{font-size:14px;color:var(--on-surface-variant);margin-top:2px;}
  .role{font-size:14px;color:var(--on-surface-variant);margin-bottom:20px;}
  .role b{color:var(--on-surface);font-weight:600;}

  .fms-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .fms-btn{height:104px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--surface-container);color:var(--on-surface);}
  .fms-btn .num{font-size:32px;font-weight:700;}
  .fms-btn .label{font-size:12px;font-weight:500;text-align:center;padding:0 8px;margin-top:4px;}
  .fms-btn.active{background:var(--fms3);color:#1B1300;}

  .crew{margin-top:28px;}
  .crew h3{font-size:15px;font-weight:600;margin:0 0 10px 0;}
  .crew-row{font-size:15px;padding:6px 0;color:var(--on-surface);}

  .navbar{height:72px;border-top:1px solid var(--outline);display:flex;background:var(--surface-variant);}
  .nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--on-surface-variant);}
  .nav-tab .ic{width:24px;height:24px;border-radius:6px;background:var(--on-surface-variant);opacity:.4;}
  .nav-tab.active{color:var(--primary);font-weight:600;}
  .nav-tab.active .ic{background:var(--primary);opacity:1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="appbar">Mein Fahrzeug</div>
  <div class="content">
    <div class="vehicle-head">
      <div class="name">Florian 46/1</div>
      <div class="kind">HLF-1 – HLF</div>
    </div>
    <div class="role">Deine Funktion: <b>GF</b> · Status: <b>3 – Einsatz übernommen</b></div>
    <div class="fms-grid">
      <div class="fms-btn"><div class="num">1</div><div class="label">Einsatzbereit über Funk</div></div>
      <div class="fms-btn"><div class="num">2</div><div class="label">Einsatzbereit auf Wache</div></div>
      <div class="fms-btn active"><div class="num">3</div><div class="label">Einsatz übernommen</div></div>
      <div class="fms-btn"><div class="num">4</div><div class="label">Am Einsatzort</div></div>
      <div class="fms-btn"><div class="num">5</div><div class="label">Sprechwunsch</div></div>
      <div class="fms-btn"><div class="num">6</div><div class="label">Nicht einsatzbereit</div></div>
    </div>
    <div class="crew">
      <h3>Besatzung</h3>
      <div class="crew-row">GF Max M.</div>
      <div class="crew-row">MA Erika M.</div>
    </div>
  </div>
  <div class="navbar">
    <div class="nav-tab active"><div class="ic"></div>Fahrzeug</div>
    <div class="nav-tab"><div class="ic"></div>Einsätze</div>
    <div class="nav-tab"><div class="ic"></div>Durchsagen</div>
    <div class="nav-tab"><div class="ic"></div>Ablauf</div>
  </div>
</div>
</body>
</html>
