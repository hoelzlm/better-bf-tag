name: bftag_core
description: Gemeinsame Dart-Logik fuer apps/web und apps/mobile (Domain, API, Theme).
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  built_collection: '>=5.1.1 <6.0.0'
  uuid: ^4.5.1
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  bftag_api_client:
    path: ../api_client

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.1

flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
