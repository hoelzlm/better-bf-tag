name: Uptime check

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check /api/v1/health
        run: |
          if [ -z "${BFTAG_URL:-}" ]; then
            echo "::notice::BFTAG_URL repository variable is not set, skipping uptime check."
            exit 0
          fi
          curl -fsS --max-time 15 --retry 2 "$BFTAG_URL/api/v1/health"
        env:
          BFTAG_URL: ${{ vars.BFTAG_URL }}
